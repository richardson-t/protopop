on: push

jobs:
  format:
    name: Code formatting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
      	uses: actions/checkout@v4
      - name: Python setup
        uses: actions.setup-python@v5
	with:
	  python-version: '3.14'
      - name: Run pre-commits
        run: |
	  pip install pre-commit
	  pre-commit run --all-files
